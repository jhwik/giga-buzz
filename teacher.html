<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 대시보드 - Giga Buzz</title>
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .control-panel { background: #e8f4f8; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        input[type="number"] { padding: 8px; font-size: 16px; width: 80px; text-align: center; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; transition: 0.2s; color: white; }
        button:active { transform: scale(0.95); }
        
        /* 상단 컨트롤 버튼 색상 */
        .btn-start { background: #3498db; }
        .btn-start:hover { background: #2980b9; }
        .btn-stop { background: #e74c3c; }
        .btn-stop:hover { background: #c0392b; }
        
        /* 강력한 초기화 버튼 (오른쪽 정렬 및 눈에 띄게) */
        .btn-reset-all { background: #34495e; margin-left: auto; border: 2px solid #2c3e50; }
        .btn-reset-all:hover { background: #2c3e50; }

        /* 학생별 채점 버튼 색상 */
        .btn-correct { background: #2ecc71; margin-left: 10px; font-size: 14px; padding: 6px 12px; }
        .btn-correct:hover { background: #27ae60; }
        .btn-wrong { background: #e67e22; margin-left: 5px; font-size: 14px; padding: 6px 12px; }
        .btn-wrong:hover { background: #d35400; }

        ul { list-style: none; padding: 0; min-height: 50px; }
        li { background: #ecf0f1; margin: 5px 0; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        .btn-group { display: flex; gap: 5px; }
        .section-title { border-bottom: 2px solid #3498db; padding-bottom: 5px; color: #34495e; margin-top: 30px; display: flex; justify-content: space-between; align-items: center; }
        .empty-msg { font-weight: normal; font-size: 14px; color: gray; text-align: center; padding: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>👨‍🏫 Giga Buzz 선생님 대시보드</h1>
        
        <div class="control-panel">
            <label style="font-weight: bold;">🎯 배점 : </label>
            <input type="number" id="pointValue" value="10">
            <button class="btn-start" onclick="startRound()">🔔 버저 활성화</button>
            <button class="btn-stop" onclick="stopBuzzer()">🔒 버저 잠금</button>
            <!-- 모든 데이터 삭제 버튼 -->
            <button class="btn-reset-all" onclick="resetAllData()">🧹 전체 초기화 (학생 내보내기)</button>
        </div>

        <h2 class="section-title">
            <span>⚡ 버저 누른 순서</span>
            <span style="font-size: 16px;">상태: <span id="buzzerStatus" style="color:red;">잠김</span></span>
        </h2>
        <ul id="buzzerList">
            <li class="empty-msg">대기 중... (버저를 활성화해주세요)</li>
        </ul>

        <h2 class="section-title">🏆 학생 점수 현황</h2>
        <ul id="scoreBoard">
            <li class="empty-msg">접속한 학생이 없습니다.</li>
        </ul>
    </div>

    <script>
        // Firebase 접속 정보
        const firebaseConfig = {
            apiKey: "AIzaSyCJ2RTGd9hlM4G_vGq1yjfbhwhLRlPQ6O8",
            authDomain: "giga-buzz.firebaseapp.com",
            databaseURL: "https://giga-buzz-default-rtdb.firebaseio.com",
            projectId: "giga-buzz",
            storageBucket: "giga-buzz.firebasestorage.app",
            messagingSenderId: "123263420761",
            appId: "1:123263420761:web:23643403fc18bb1d2ce448"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 선생님 화면 상단 버저 상태(열림/잠김) 텍스트 연동
        db.ref('gameState/isBuzzerActive').on('value', (snapshot) => {
            const statusSpan = document.getElementById('buzzerStatus');
            if(snapshot.val() === true) {
                statusSpan.innerText = "활성화 됨🟢";
                statusSpan.style.color = "green";
            } else {
                statusSpan.innerText = "잠김🔴";
                statusSpan.style.color = "red";
            }
        });

        // 1. 라운드 시작 (버저 활성화)
        function startRound() {
            db.ref('buzzers').remove(); // 이전 누른 기록 지우기
            db.ref('gameState/isBuzzerActive').set(true);
        }

        // 2. 버저 강제 잠금
        function stopBuzzer() {
            db.ref('gameState/isBuzzerActive').set(false);
        }

        // 3. 🚨 모든 데이터 완전히 초기화 (학생 명단 포함)
        function resetAllData() {
            // 실수로 누르는 것을 방지하기 위해 두 번 물어봅니다.
            if(confirm("정말 모든 학생 명단과 점수, 누른 기록을 초기화하시겠습니까?\n(다른 반 수업을 새로 시작할 때만 사용하세요)")) {
                
                // 1) 학생 명단 및 점수 삭제
                db.ref('players').remove();
                // 2) 버저 누른 기록 삭제
                db.ref('buzzers').remove();
                // 3) 버저 상태 잠금으로 변경
                db.ref('gameState/isBuzzerActive').set(false);
                
                alert("성공적으로 모두 초기화되었습니다! 깨끗한 상태로 새 게임을 시작할 수 있습니다.");
            }
        }

        // 4. 실시간 버저 순서 감지
        db.ref('buzzers').orderByValue().on('value', (snapshot) => {
            const list = document.getElementById('buzzerList');
            list.innerHTML = '';
            
            if(!snapshot.exists()) {
                list.innerHTML = '<li class="empty-msg">아직 누른 학생이 없습니다.</li>';
                return;
            }

            let rank = 1;
            snapshot.forEach((child) => {
                const name = child.key;
                const li = document.createElement('li');
                
                let medal = "🔹";
                if(rank === 1) medal = "🥇";
                if(rank === 2) medal = "🥈";
                if(rank === 3) medal = "🥉";
                
                li.innerHTML = `<span>${medal} ${rank}등 : ${name}</span>`;
                
                // 정답, 오답 버튼
                const btnGroup = document.createElement('div');
                btnGroup.className = "btn-group";

                const correctBtn = document.createElement('button');
                correctBtn.innerText = "정답 (+)";
                correctBtn.className = "btn-correct";
                correctBtn.onclick = () => awardPoints(name, true);

                const wrongBtn = document.createElement('button');
                wrongBtn.innerText = "오답 (-)";
                wrongBtn.className = "btn-wrong";
                wrongBtn.onclick = () => awardPoints(name, false);

                btnGroup.appendChild(correctBtn);
                btnGroup.appendChild(wrongBtn);
                li.appendChild(btnGroup);
                
                list.appendChild(li);
                rank++;
            });
        });

        // 5. 점수 부여 및 감점 처리
        function awardPoints(name, isCorrect) {
            const points = parseInt(document.getElementById('pointValue').value);
            const playerRef = db.ref('players/' + name + '/score');
            
            playerRef.transaction((currentScore) => {
                let score = currentScore || 0;
                if(isCorrect) {
                    return score + points; // 정답: 더하기
                } else {
                    return score - points; // 오답: 빼기
                }
            });
            
            db.ref('gameState/isBuzzerActive').set(false); // 채점 후 일단 버저 잠금
            
            if(isCorrect) {
                alert(`🎉 정답! [${name}] 학생에게 ${points}점 부여 완료!`);
            } else {
                alert(`❌ 오답! [${name}] 학생에게서 ${points}점 차감!`);
            }
        }

        // 6. 점수판 실시간 업데이트
        db.ref('players').orderByChild('score').on('value', (snapshot) => {
            const scores = document.getElementById('scoreBoard');
            scores.innerHTML = '';
            
            if(!snapshot.exists()) {
                scores.innerHTML = '<li class="empty-msg">접속한 학생이 없습니다.</li>';
                return;
            }

            let tempArray = [];
            snapshot.forEach((child) => {
                tempArray.push({ name: child.key, score: child.val().score });
            });
            tempArray.reverse();

            tempArray.forEach((student, index) => {
                scores.innerHTML += `<li><span>${index + 1}. ${student.name}</span> <span style="color: #e74c3c;">${student.score}점</span></li>`;
            });
        });
    </script>
</body>
</html>
